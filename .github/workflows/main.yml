name: build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the zip name and the plugin (empty: dev-<short sha>)"
        required: false
        default: ""
        type: string
      publish_release:
        description: "Create the GitHub release v<version> and attach the zip (needs a version)"
        required: false
        default: false
        type: boolean
      check_upstream:
        description: "Also check the plugin against the latest MHGURecomp release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish_release }}
        run: |
          v="${INPUT_VERSION#v}"
          if [ -z "$v" ]; then
            if [ "$PUBLISH" = "true" ]; then echo "a release needs a version"; exit 1; fi
            v="dev-${GITHUB_SHA::7}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-vulkan-headers

      - name: Build the layer DLL
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make -j4 VERSION="$VERSION"

      - name: Smoke test
        run: make smoke VERSION="${{ steps.version.outputs.version }}"

      - name: Stage the release folder
        run: make dist VERSION="${{ steps.version.outputs.version }}"

      - name: Create the zip
        shell: pwsh
        run: python tools/package.py dist/stage "dist/MHGURecomp-FSR4-Layer-${{ steps.version.outputs.version }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: MHGURecomp-FSR4-Layer-${{ steps.version.outputs.version }}
          path: |
            dist/MHGURecomp-FSR4-Layer-${{ steps.version.outputs.version }}.zip
            dist/MHGURecomp-FSR4-Layer-${{ steps.version.outputs.version }}.zip.sha256
          if-no-files-found: error

      - name: Attach the zip to the release
        if: inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/MHGURecomp-FSR4-Layer-${{ steps.version.outputs.version }}.zip
            dist/MHGURecomp-FSR4-Layer-${{ steps.version.outputs.version }}.zip.sha256
          generate_release_notes: true

  compat:
    if: inputs.check_upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Download the latest MHGURecomp Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo morerokk/MHGURecomp --pattern 'Windows-MHGURecomp.*.zip' --dir upstream
          unzip -q upstream/Windows-MHGURecomp.*.zip -d upstream/game
          echo "GAME_EXE=$(find upstream/game -name mhgurecomp.exe | head -n 1)" >> "$GITHUB_ENV"

      - name: Check the plugin still fits the game
        run: python tools/check_upstream.py --exe "$GAME_EXE"

      - name: Check the symbol lookup against the game
        run: make test-coff EXE="$GAME_EXE"
